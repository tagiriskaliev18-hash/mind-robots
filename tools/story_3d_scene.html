// Procedural brushed anodized texture + radial studio floor gradient + silicon lithograph texture
function makeBrushedTex() {
  const c = document.createElement("canvas");
  c.width = c.height = 512;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#808080";
  ctx.fillRect(0, 0, 512, 512);
  for (let y = 0; y < 512; y++) {
    const v = 120 + Math.round((Math.sin(y * 0.71) * 0.5 + ((y * 37) % 19) / 19 - 0.5) * 18);
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect(0, y, 512, 1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 4);
  return tex;
}

function makeFloorGlowTex() {
  const c = document.createElement("canvas");
  c.width = c.height = 1024;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#09090f";
  ctx.fillRect(0, 0, 1024, 1024);
  const g = ctx.createRadialGradient(512, 512, 16, 512, 512, 500);
  g.addColorStop(0.00, "rgba(38, 44, 72, 0.95)");
  g.addColorStop(0.28, "rgba(22, 24, 44, 0.85)");
  g.addColorStop(0.62, "rgba(12, 13, 22, 0.55)");
  g.addColorStop(1.00, "rgba(9, 9, 15, 0.00)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 1024);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeSiliconWaferTex() {
  const c = document.createElement("canvas");
  c.width = c.height = 1024;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#04060b";
  ctx.fillRect(0, 0, 1024, 1024);

  // Concentric brushed die vignette
  const bg = ctx.createRadialGradient(512, 512, 40, 512, 512, 480);
  bg.addColorStop(0, "rgba(0, 245, 255, 0.16)");
  bg.addColorStop(0.38, "rgba(75, 59, 255, 0.12)");
  bg.addColorStop(0.72, "rgba(18, 24, 42, 0.20)");
  bg.addColorStop(1, "rgba(4, 6, 11, 0)");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 1024, 1024);

  // Lithography hairline grid around dark core
  ctx.lineWidth = 1.4;
  for (let i = 1; i <= 14; i++) {
    const r = 135 + i * 22;
    ctx.strokeStyle = i % 3 === 0 ? "rgba(123, 47, 247, 0.42)" : "rgba(0, 245, 255, 0.30)";
    ctx.beginPath();
    ctx.arc(512, 512, r, 0, Math.PI * 2);
    ctx.stroke();
  }
  // Radial gold/cyan micro-bus busses
  for (let i = 0; i < 64; i++) {
    const a = (i / 64) * Math.PI * 2;
    ctx.strokeStyle = i % 8 === 0 ? "rgba(227, 175, 95, 0.65)" : (i % 4 === 0 ? "rgba(123, 47, 247, 0.55)" : "rgba(0, 245, 255, 0.48)");
    ctx.lineWidth = i % 8 === 0 ? 2.2 : 1.1;
    ctx.beginPath();
    ctx.moveTo(512 + Math.cos(a) * 142, 512 + Math.sin(a) * 142);
    ctx.lineTo(512 + Math.cos(a) * 445, 512 + Math.sin(a) * 445);
    ctx.stroke();
  }
  // Central neural core dies (subtle crisp lithography cells)
  ctx.strokeStyle = "rgba(0, 245, 255, 0.72)";
  ctx.lineWidth = 2.0;
  ctx.strokeRect(390, 390, 244, 244);
  for (let r = 0; r < 8; r++) {
    for (let k = 0; k < 8; k++) {
      const lit = (r === 3 || r === 4) && (k === 3 || k === 4);
      ctx.fillStyle = lit ? "rgba(0, 245, 255, 0.85)" : ((r + k) % 2 === 0 ? "rgba(75, 59, 255, 0.36)" : "rgba(0, 245, 255, 0.24)");
      ctx.fillRect(408 + k * 27, 408 + r * 27, 20, 20);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const PARTS_MAP = [

function toFloat(src) {
  const geo = new THREE.BufferGeometry();
  for (const [key, attr] of Object.entries(src.attributes)) {
    if (attr.array instanceof Float32Array && !attr.isInterleavedBufferAttribute && !attr.normalized) {
      geo.setAttribute(key, new THREE.BufferAttribute(new Float32Array(attr.array), attr.itemSize));
    } else {
      const data = new Float32Array(attr.count * attr.itemSize);
      for (let i = 0; i < attr.count; i++) {
        for (let k = 0; k < attr.itemSize; k++) data[i * attr.itemSize + k] = attr.getComponent(i, k);
      }
      geo.setAttribute(key, new THREE.BufferAttribute(data, attr.itemSize));
    }
  }
  if (src.index) geo.setIndex(Array.from(src.index.array));
  if (!geo.attributes.normal) geo.computeVertexNormals();
  return geo;
}

rawBox.setFromObject(gltf.scene);

gltf.scene.position.sub(new THREE.Vector3(rawC.x, rawBox.min.y, rawC.z));
gltf.scene.updateMatrixWorld(true);

// Clipping planes for laser CAD->solid sweep AND visor opening cross-section
const clipSolidAbove = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0); // hides geometry above scanY (when normal is -Y, keeps y < constant)
const clipWireBelow = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);   // keeps wireframe above scanY

const solidShellProto = new THREE.MeshPhysicalMaterial({
  color: 0xebe8e0, roughness: 0.28, roughnessMap: brushedTex, bumpMap: brushedTex, bumpScale: 0.0012,
  metalness: 0.05, clearcoat: 0.56, clearcoatRoughness: 0.18, envMapIntensity: 0.52
});
const solidJointProto = new THREE.MeshStandardMaterial({
  color: 0x3b4252, roughness: 0.34, roughnessMap: brushedTex, bumpMap: brushedTex, bumpScale: 0.0018,
  metalness: 0.82, envMapIntensity: 0.96
});

const robotRoot = new THREE.Group();
scene.add(robotRoot);

const wireGroup = new THREE.Group();
scene.add(wireGroup);

const wireMat = new THREE.LineBasicMaterial({ color: 0x00f5ff, transparent: true, opacity: 0.58, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
const holoShellMat = new THREE.MeshBasicMaterial({ color: 0x1e4dff, transparent: true, opacity: 0.09, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });

const parts = [];
const gltfMeshes = [];
gltf.scene.traverse((o) => { if (o.isMesh && !o.isSkinnedMesh) gltfMeshes.push(o); });

for (const obj of gltfMeshes) {
  const geo = toFloat(obj.geometry).applyMatrix4(obj.matrixWorld);
  geo.computeBoundingBox();
  const center = geo.boundingBox.getCenter(new THREE.Vector3());
  const name = obj.name || obj.parent?.name || "part";
  const group = groupOf(name);
  const dark = obj.material?.color && obj.material.color.r < 0.4;

  const mat = (dark ? solidJointProto : solidShellProto).clone();
  mat.clippingPlanes = [clipSolidAbove];
  mat.transparent = true;

  const mesh = new THREE.Mesh(geo, mat);
  mesh.name = name;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  robotRoot.add(mesh);

  // Blueprint wireframe twin (crisp architectural edge angle 28deg, no noisy floor clumps)
  const edges = new THREE.EdgesGeometry(geo, 28);
  const line = new THREE.LineSegments(edges, wireMat.clone());
  line.material.clippingPlanes = [clipWireBelow];
  wireGroup.add(line);

  const holo = new THREE.Mesh(geo, holoShellMat.clone());
  holo.material.clippingPlanes = [clipWireBelow];
  wireGroup.add(holo);

  // Explode vector: outward + tailored per kinematic role
  const ex = new THREE.Vector3();
  if (group === "legL") ex.set(-0.08, -0.04, -0.26);
  else if (group === "legR") ex.set(-0.08, -0.04, 0.26);
  else if (group === "base") ex.set(-0.18, 0.05, 0);
  else if (group === "waist") ex.set(-0.12, 0.12, 0);
  else if (group === "armL") ex.set(0.06, 0.08, -0.46);
  else if (group === "armR") ex.set(0.06, 0.08, 0.46);
  else if (group === "head") ex.set(0.14, 0.28, 0);
  else if (group === "logo") ex.set(0.28, 0.06, 0);
  else ex.set(dark ? -0.10 : 0.20, 0.14, (center.z >= 0 ? 1 : -1) * (dark ? 0.04 : 0.16));

  parts.push({ name, group, dark, center, mesh, line, holo, mat, ex });
}

const chipletCyanMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0x00f5ff).multiplyScalar(1.08), toneMapped: false, transparent: true, opacity: 0 });
const chipletDarkMat = new THREE.MeshStandardMaterial({ color: 0x16223a, roughness: 0.2, metalness: 0.9, transparent: true, opacity: 0 });
for (let r = -3; r <= 3; r++) {
  for (let c = -3; c <= 3; c++) {
    if (Math.abs(r) <= 1 && Math.abs(c) <= 1) continue;
    const chip = new THREE.Mesh(chipletGeo, (r + c) % 2 === 0 ? chipletDarkMat : chipletCyanMat);
    chip.position.set(c * 0.0078, r * 0.0078, 0.0095);
    coreGroup.add(chip);
  }
}

const dieCoreGridMat = new THREE.MeshBasicMaterial({ map: waferTex, blending: THREE.AdditiveBlending, transparent: true, opacity: 0, toneMapped: false });
const dieCoreGrid = new THREE.Mesh(
  new THREE.PlaneGeometry(0.042, 0.042),
  dieCoreGridMat
);
dieCoreGrid.position.z = 0.011;
coreGroup.add(dieCoreGrid);

const halo1 = new THREE.Mesh(new THREE.TorusGeometry(0.056, 0.0012, 8, 72), fiberCyan);
halo1.position.z = 0.022;
const halo2 = new THREE.Mesh(new THREE.TorusGeometry(0.070, 0.0011, 8, 72), fiberViolet);
halo2.position.z = 0.036;
const halo3 = new THREE.Mesh(new THREE.TorusGeometry(0.081, 0.0009, 8, 72), opticGold);
halo3.position.z = 0.050;
coreGroup.add(halo1, halo2, halo3);

const shutterL = new THREE.Object3D();
const shutterR = new THREE.Object3D();

// Post-processing: balanced ACES/AgX Bloom (rich #00F5FF & #7B2FF7 glow, NO clipping to green!)
const composer = new EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType, multisampling: 0 });
composer.addPass(new RenderPass(scene, camera));
const bloom = new BloomEffect({ luminanceThreshold: 1.18, luminanceSmoothing: 0.36, intensity: 0.88, radius: 0.44, levels: 5, mipmapBlur: true });
composer.addPass(new EffectPass(camera, bloom, new SMAAEffect({ preset: SMAAPreset.HIGH }), new ToneMappingEffect({ mode: ToneMappingMode.AGX })));

// Continuous Camera Path with EXACT time-to-arc calibration (Stage 5 visor entry at t=0.72..0.88, ZERO dead black frames!)
function makeWeightedTrack(pts, knotTimes, looks) {
  const curve = new THREE.CatmullRomCurve3(pts, false, "centripetal", 0.35);
  const lookCurve = new THREE.CatmullRomCurve3(looks, false, "centripetal", 0.35);
  const N = 400;
  const samples = Array.from({ length: N + 1 }, (_, k) => curve.getPointAt(k / N));
  const arcKnots = pts.map((p) => {
    let bestK = 0, bestD = Infinity;
    for (let k = 0; k <= N; k++) {
      const d = samples[k].distanceToSquared(p);
      if (d < bestD) { bestD = d; bestK = k; }
    }
    return bestK / N;
  });
  arcKnots[0] = 0;
  arcKnots[arcKnots.length - 1] = 1;
  return {
    sample(t) {
      let i = 0;
      while (i < knotTimes.length - 2 && t > knotTimes[i + 1]) i++;
      const t0 = knotTimes[i], t1 = knotTimes[i + 1];
      const f = Math.min(1, Math.max(0, (t - t0) / Math.max(1e-5, t1 - t0)));
      const sf = f * f * (3 - 2 * f);
      const u = arcKnots[i] + (arcKnots[i + 1] - arcKnots[i]) * sf;
      return { pos: curve.getPointAt(u), look: lookCurve.getPointAt(u) };
    }
  };
}

const KNOTS = [0.00, 0.16, 0.36, 0.56, 0.72, 0.82, 0.91, 1.00];

const deskTrack = makeWeightedTrack([
  new THREE.Vector3(2.85, 0.62,  2.10), // 0.00 Stage 1: Blueprint wide low 3/4
  new THREE.Vector3(2.65, 0.78,  1.15), // 0.16 Stage 2: Skeleton & lower limbs lock
  new THREE.Vector3(2.35, 0.88, -1.05), // 0.36 Stage 3: Orbital sweep across -Z flank (arms assemble)
  new THREE.Vector3(1.80, 1.00,  0.42), // 0.56 Stage 4: Full hero finish & causal cyan ignition
  new THREE.Vector3(0.55, 1.21,  0.02), // 0.72 Stage 5a: Push in close to luminous visor
  new THREE.Vector3(0.10, 1.20,  0.00), // 0.82 Stage 5b: Cross visor lens threshold
  new THREE.Vector3(-0.20, 1.17, 0.00), // 0.91 Stage 6a: Fly inside anodized optical tunnel
  new THREE.Vector3(-0.42, 1.17, 0.00), // 1.00 Stage 6b: Lock onto Mind 100 TOPS Neural Silicon Core
], KNOTS, [
  new THREE.Vector3(0.00, 0.68, -0.24),
  new THREE.Vector3(0.00, 0.70, -0.18),
  new THREE.Vector3(0.00, 0.78,  0.14),
  new THREE.Vector3(0.00, 0.88, -0.05),
  new THREE.Vector3(-0.08, 1.20, 0.00),
  new THREE.Vector3(-0.32, 1.17, 0.00),
  new THREE.Vector3(-0.60, 1.17, 0.00),
  new THREE.Vector3(-0.60, 1.17, 0.00),
]);

const mobTrack = makeWeightedTrack([
  new THREE.Vector3(3.10, 0.68,  2.35), // 0.00 Portrait 9:16: Upper 62% framing
  new THREE.Vector3(2.85, 0.84,  1.20),
  new THREE.Vector3(2.45, 0.92, -1.10),
  new THREE.Vector3(1.94, 1.04,  0.38),
  new THREE.Vector3(0.60, 1.21,  0.02),
  new THREE.Vector3(0.10, 1.20,  0.00),
  new THREE.Vector3(-0.20, 1.17, 0.00),
  new THREE.Vector3(-0.41, 1.17, 0.00),
], KNOTS, [
  new THREE.Vector3(0.00, 0.48,  0.00),
  new THREE.Vector3(0.00, 0.50,  0.00),
  new THREE.Vector3(0.00, 0.58,  0.00),
  new THREE.Vector3(0.00, 0.78,  0.00),
  new THREE.Vector3(-0.08, 1.19, 0.00),
  new THREE.Vector3(-0.32, 1.17, 0.00),
  new THREE.Vector3(-0.60, 1.17, 0.00),
  new THREE.Vector3(-0.60, 1.17, 0.00),
]);

const activeTrack = MODE === "mobile" ? mobTrack : deskTrack;

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (t) => t * t * (3 - 2 * t);
const seg = (t, a, b) => smooth(clamp((t - a) / (b - a), 0, 1));
const expoOut = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -9 * x));

function renderAt(t) {
  t = clamp(t, 0, 1);

  const { pos: pPos, look: pLook } = activeTrack.sample(t);
  camera.position.copy(pPos);
  camera.lookAt(pLook);
  backdropHalo.lookAt(pPos);
  const baseFov = MODE === "mobile" ? 41 : 33;
  camera.fov = baseFov + seg(t, 0.72, 0.98) * 7;
  camera.updateProjectionMatrix();

  // Stage 1-2: Vertical Laser Scan Plane (sweeps 0 -> 1.48m during t=0.02..0.34)
  const scanNorm = seg(t, 0.02, 0.34);
  const scanY = -0.05 + scanNorm * 1.56;
  clipSolidAbove.constant = t < 0.02 ? -0.1 : (t > 0.36 ? 5.0 : scanY);
  clipWireBelow.constant = t < 0.02 ? 0.1 : -scanY;

  scanRingGroup.position.y = scanY;
  const ringVis = t > 0.01 && t < 0.36 ? Math.sin(clamp((t - 0.01) / 0.35, 0, 1) * Math.PI) : 0;
  scanRingGroup.visible = ringVis > 0.02;
  scanDisc.material.opacity = ringVis * 0.16;
  scanRingGroup.scale.setScalar(0.88 + Math.sin(t * 24) * 0.04);

  const wireAlpha = 1 - seg(t, 0.30, 0.52);
  wireGroup.visible = wireAlpha > 0.01;

  // Stage 2-4: Real Kinematic Mechanical Part Assembly! (Locked 100% solid by t=0.58)
  const explodeAt = (group, dark) => {
    if (group === "base" || group === "legL" || group === "legR") return 1 - expoOut(seg(t, 0.08, 0.28));
    if (group === "waist" || (dark && group === "torso")) return 1 - expoOut(seg(t, 0.16, 0.36));
    if (group === "armL" || group === "armR") return 1 - expoOut(seg(t, 0.24, 0.48));
    if (group === "head" || group === "logo") return 1 - expoOut(seg(t, 0.38, 0.58));
    return 1 - expoOut(seg(t, 0.34, 0.56));
  };

  // Stage 5: Smooth entry into cranial visor (stay solid up close until lens crosses visor portal t >= 0.75!)
  const headEnterFade = seg(t, 0.73, 0.80);
  const fullBodyFade = seg(t, 0.76, 0.84);

  for (const pt of parts) {
    const k = explodeAt(pt.group, pt.dark);
    pt.mesh.position.copy(pt.ex).multiplyScalar(k);
    if (pt.group === "head") {
      pt.mesh.position.y += headEnterFade * 0.032;
      pt.mat.opacity = 1 - headEnterFade;
    } else {
      pt.mat.opacity = 1 - fullBodyFade;
    }

    pt.line.position.copy(pt.mesh.position);
    pt.holo.position.copy(pt.mesh.position);
    pt.line.material.opacity = wireAlpha * 0.58;
    pt.holo.material.opacity = wireAlpha * 0.09;
  }

  // Causal Ignition at Stage 4 finish (t=0.52..0.78), dims seamlessly into visor interior
  const ledLevel = seg(t, 0.52, 0.62) * (1 - seg(t, 0.73, 0.80));
  ledMat.opacity = ledLevel;

  // Reveal Internal Sensor & Neural Core Canyon strictly INSIDE the visor portal (no exterior background disk!)
  const enterTunnel = seg(t, 0.76, 0.85);
  const coreFade = seg(t, 0.78, 0.88);
  internalBay.visible = enterTunnel > 0.004;
  tunnelMat.opacity = enterTunnel;
  ribMat.opacity = enterTunnel;
  opticGold.opacity = enterTunnel;
  fiberCyan.opacity = enterTunnel;
  fiberViolet.opacity = enterTunnel;
  carrierMat.opacity = coreFade;
  heatsinkMat.opacity = coreFade;
  dieBaseMat.opacity = coreFade;
  chipletDarkMat.opacity = coreFade;
  chipletCyanMat.opacity = coreFade;
  waferMat.opacity = seg(t, 0.78, 0.90);
  dieCoreGridMat.opacity = coreFade * 0.95;
  fiberCyan.color.setHex(0x00f5ff).multiplyScalar(enterTunnel);
  fiberViolet.color.setHex(0x7b2ff7).multiplyScalar(enterTunnel);
  scene.fog.density = 0.165 + seg(t, 0.72, 0.88) * 0.42;
  keyLight.intensity = 3.2 * (1 - seg(t, 0.72, 0.85) * 0.88);
  fillLight.intensity = 0.62 * (1 - seg(t, 0.72, 0.85) * 0.90);
  coreSpot.intensity = coreFade * 2.1;
  lidarGimbal.rotation.x = t * Math.PI * 6;
  halo1.rotation.z = t * Math.PI * 2.5;
  halo2.rotation.z = -t * Math.PI * 1.8;
  halo3.rotation.z = t * Math.PI * 1.2;
  backdropHalo.material.opacity = 1 - seg(t, 0.74, 0.88);
  backdropHalo.visible = t < 0.89;
  envGroup.visible = t < 0.94;
  robotRoot.visible = t < 0.85;

  composer.render(1 / 30);
}

renderAt(0);
window.__story3d = { renderAt, width: W, height: H, partCount: parts.length };
