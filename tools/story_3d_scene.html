function makeBrushedTex() {
  const c = document.createElement("canvas");
  c.width = c.height = 512;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#808080";
  ctx.fillRect(0, 0, 512, 512);
  for (let y = 0; y < 512; y++) {
    const v = 122 + Math.round((Math.sin(y * 0.71) * 0.5 + ((y * 37) % 19) / 19 - 0.5) * 14);
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect(0, y, 512, 1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 4);
  return tex;
}

function makeFloorGlowTex() {
  const c = document.createElement("canvas");
  c.width = c.height = 1024;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#09090f";
  ctx.fillRect(0, 0, 1024, 1024);
  const g = ctx.createRadialGradient(512, 512, 16, 512, 512, 500);
  g.addColorStop(0.00, "rgba(38, 44, 72, 0.95)");
  g.addColorStop(0.28, "rgba(22, 24, 44, 0.85)");
  g.addColorStop(0.62, "rgba(12, 13, 22, 0.55)");
  g.addColorStop(1.00, "rgba(9, 9, 15, 0.00)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 1024);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeSiliconWaferTex() {
  const c = document.createElement("canvas");
  c.width = c.height = 1024;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#04060b";
  ctx.fillRect(0, 0, 1024, 1024);

  const bg = ctx.createRadialGradient(512, 512, 40, 512, 512, 480);
  bg.addColorStop(0, "rgba(0, 245, 255, 0.16)");
  bg.addColorStop(0.38, "rgba(75, 59, 255, 0.12)");
  bg.addColorStop(0.72, "rgba(18, 24, 42, 0.20)");
  bg.addColorStop(1, "rgba(4, 6, 11, 0)");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 1024, 1024);

  ctx.lineWidth = 1.4;
  for (let i = 1; i <= 14; i++) {
    const r = 135 + i * 22;
    ctx.strokeStyle = i % 3 === 0 ? "rgba(123, 47, 247, 0.42)" : "rgba(0, 245, 255, 0.30)";
    ctx.beginPath();
    ctx.arc(512, 512, r, 0, Math.PI * 2);
    ctx.stroke();
  }
  for (let i = 0; i < 64; i++) {
    const a = (i / 64) * Math.PI * 2;
    ctx.strokeStyle = i % 8 === 0 ? "rgba(227, 175, 95, 0.65)" : (i % 4 === 0 ? "rgba(123, 47, 247, 0.55)" : "rgba(0, 245, 255, 0.48)");
    ctx.lineWidth = i % 8 === 0 ? 2.2 : 1.1;
    ctx.beginPath();
    ctx.moveTo(512 + Math.cos(a) * 142, 512 + Math.sin(a) * 142);
    ctx.lineTo(512 + Math.cos(a) * 445, 512 + Math.sin(a) * 445);
    ctx.stroke();
  }
  ctx.strokeStyle = "rgba(0, 245, 255, 0.72)";
  ctx.lineWidth = 2.0;
  ctx.strokeRect(390, 390, 244, 244);
  for (let r = 0; r < 8; r++) {
    for (let k = 0; k < 8; k++) {
      const lit = (r === 3 || r === 4) && (k === 3 || k === 4);
      ctx.fillStyle = lit ? "rgba(0, 245, 255, 0.85)" : ((r + k) % 2 === 0 ? "rgba(75, 59, 255, 0.36)" : "rgba(0, 245, 255, 0.24)");
      ctx.fillRect(408 + k * 27, 408 + r * 27, 20, 20);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function toFloat(src) {
  const geo = new THREE.BufferGeometry();
  for (const [key, attr] of Object.entries(src.attributes)) {
    if (attr.array instanceof Float32Array && !attr.isInterleavedBufferAttribute && !attr.normalized) {
      geo.setAttribute(key, new THREE.BufferAttribute(new Float32Array(attr.array), attr.itemSize));
    } else {
      const data = new Float32Array(attr.count * attr.itemSize);
      const scale = attr.normalized ? (
        attr.array instanceof Int8Array ? 1 / 127 :
        attr.array instanceof Uint8Array ? 1 / 255 :
        attr.array instanceof Int16Array ? 1 / 32767 :
        attr.array instanceof Uint16Array ? 1 / 65535 : 1
      ) : 1;
      for (let i = 0; i < attr.count; i++) {
        for (let k = 0; k < attr.itemSize; k++) data[i * attr.itemSize + k] = attr.getComponent(i, k) * (scale === 1 ? 1 : 1);
      }
      geo.setAttribute(key, new THREE.BufferAttribute(data, attr.itemSize));
    }
  }
  if (src.index) geo.setIndex(Array.from(src.index.array));
  if (!geo.attributes.normal) geo.computeVertexNormals();
  return geo;
}

const solidShellProto = new THREE.MeshPhysicalMaterial({

});

});

const wireMat = new THREE.LineBasicMaterial({ color: 0x00f5ff, transparent: true, opacity: 0.56, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
const holoShellMat = new THREE.MeshBasicMaterial({ color: 0x1e4dff, transparent: true, opacity: 0.085, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });

const parts = [];
const gltfMeshes = [];
gltf.scene.traverse((o) => { if (o.isMesh && !o.isSkinnedMesh) gltfMeshes.push(o); });

for (const obj of gltfMeshes) {
  const geo = toFloat(obj.geometry).applyMatrix4(obj.matrixWorld);
  geo.computeBoundingBox();
  const center = geo.boundingBox.getCenter(new THREE.Vector3());
  const name = obj.name || obj.parent?.name || "part";
  const group = groupOf(name);
  const srcMat = obj.material;
  const matName = srcMat?.name || "";

  let mat;
  let dark = false;
  let isCutout = false;
  const isDecal = Boolean(srcMat?.map && !matName.startsWith("Palette"));
  if (isDecal) {
    srcMat.map.colorSpace = THREE.SRGBColorSpace;
    srcMat.map.needsUpdate = true;
    isCutout = srcMat.alphaMode === "MASK" || matName === "apollo_wordmark" || matName === "apollo_back_monogram";
    mat = new THREE.MeshStandardMaterial({
      map: srcMat.map,
      color: 0xffffff,
      roughness: isCutout ? 0.52 : 0.14,
      metalness: isCutout ? 0.02 : 0.18,
      envMapIntensity: isCutout ? 0.22 : 0.42,
      transparent: isCutout,
      alphaTest: isCutout ? 0.35 : 0,
      polygonOffset: true,
      polygonOffsetFactor: -1,
      polygonOffsetUnits: -1,
      clippingPlanes: [clipSolidAbove]
    });
  } else {
    let proto;
    if (matName === "apollo_faceplate") proto = solidFaceplateProto;
    else if (matName === "apollo_estop") proto = solidEstopProto;
    else if (matName === "apollo_green_led") proto = solidGreenLedProto;
    else {
      const isGlass = matName === "apollo_glass" || /visor|logo|oled/i.test(name);
      dark = !isGlass && srcMat?.color && srcMat.color.r < 0.4;
      proto = isGlass ? solidGlassProto : (dark ? solidJointProto : solidShellProto);
    }
    mat = proto.clone();
    mat.clippingPlanes = [clipSolidAbove];
    mat.transparent = false;
  }

  const mesh = new THREE.Mesh(geo, mat);
  mesh.name = name;
  mesh.castShadow = !isDecal;
  mesh.receiveShadow = !isDecal;
  robotRoot.add(mesh);

  let line = null;
  let holo = null;
  if (!isDecal) {
    const edges = new THREE.EdgesGeometry(geo, 30);
    line = new THREE.LineSegments(edges, wireMat.clone());
    line.material.clippingPlanes = [clipWireBelow];
    wireGroup.add(line);

    holo = new THREE.Mesh(geo, holoShellMat.clone());
    holo.material.clippingPlanes = [clipWireBelow];
    wireGroup.add(holo);
  }

  const ex = new THREE.Vector3();
  if (group === "legL") ex.set(-0.08, -0.04, -0.24);
  else if (group === "legR") ex.set(-0.08, -0.04, 0.24);
  else if (group === "base") ex.set(-0.16, 0.05, 0);
  else if (group === "waist") ex.set(-0.10, 0.10, 0);
  else if (group === "armL") ex.set(0.06, 0.06, -0.42);
  else if (group === "armR") ex.set(0.06, 0.06, 0.42);
  else if (group === "head") ex.set(0.12, 0.24, 0);
  else if (group === "logo") ex.set(0.24, 0.05, 0);
  else if (name.startsWith("battery_")) ex.set(-0.22, 0.08, 0);
  else ex.set(dark ? -0.08 : 0.16, 0.12, (center.z >= 0 ? 1 : -1) * (dark ? 0.04 : 0.14));

  parts.push({ name, group, dark, isDecal, isCutout, center, mesh, line, holo, mat, ex });
}

function makeWeightedTrack(pts, knotTimes, looks) {
  const curve = new THREE.CatmullRomCurve3(pts, false, "centripetal", 0.35);
  const lookCurve = new THREE.CatmullRomCurve3(looks, false, "centripetal", 0.35);
  const N = 400;
  const samples = Array.from({ length: N + 1 }, (_, k) => curve.getPointAt(k / N));
  const arcKnots = pts.map((p) => {
    let bestK = 0, bestD = Infinity;
    for (let k = 0; k <= N; k++) {
      const d = samples[k].distanceToSquared(p);
      if (d < bestD) { bestD = d; bestK = k; }
    }
    return bestK / N;
  });
  arcKnots[0] = 0;
  arcKnots[arcKnots.length - 1] = 1;
  return {
    sample(t) {
      let i = 0;
      while (i < knotTimes.length - 2 && t > knotTimes[i + 1]) i++;
      const t0 = knotTimes[i], t1 = knotTimes[i + 1];
      const f = Math.min(1, Math.max(0, (t - t0) / Math.max(1e-5, t1 - t0)));
      const sf = f * f * (3 - 2 * f);
      const u = arcKnots[i] + (arcKnots[i + 1] - arcKnots[i]) * sf;
      return { pos: curve.getPointAt(u), look: lookCurve.getPointAt(u) };
    }
  };
}

const KNOTS = [0.00, 0.16, 0.36, 0.56, 0.72, 0.82, 0.91, 1.00];

// Continuous Camera Orbit showcasing Full Blueprint -> Pelvis/Leg Actuators -> Side/Chest/Hands -> Hero Face & Chest UI -> Stereo Lens Bore -> Core
const deskTrack = makeWeightedTrack([
  new THREE.Vector3(3.38, 0.82,  2.38), // 0.00 Stage 1: Full-body blueprint low 3/4
  new THREE.Vector3(2.86, 0.98,  1.05), // 0.16 Stage 2: Open pelvis & hip mechanics + linear actuators
  new THREE.Vector3(2.22, 1.24, -1.28), // 0.36 Stage 3: Smooth armor & exposed upper-arm actuators sweep
  new THREE.Vector3(1.58, 1.44,  0.34), // 0.56 Stage 4-5: Crisp 3/4 portrait of oval faceplate, stereo eyes & APPTRONIK OLED
  new THREE.Vector3(0.60, boreY, 0.025), // 0.72 Stage 6a: Push straight to right circular stereo camera lens
  new THREE.Vector3(0.11, boreY, 0.00), // 0.82 Stage 6b: Cross optical lens threshold
  new THREE.Vector3(-0.20, boreY, 0.00), // 0.91 Stage 7a: Fly through titanium sensor bore
  new THREE.Vector3(-0.42, boreY, 0.00), // 1.00 Stage 7b: Lock onto Mind Neural Silicon Core
], KNOTS, [
  new THREE.Vector3(0.00, 0.88, -0.22),
  new THREE.Vector3(0.00, 0.92, -0.14),
  new THREE.Vector3(0.00, 1.12,  0.08),
  new THREE.Vector3(0.02, 1.41, -0.02),
  new THREE.Vector3(-0.08, boreY, 0.00),

]);

const mobTrack = makeWeightedTrack([
  new THREE.Vector3(3.75, 0.86,  2.72), // 0.00 Portrait 9:16: Upper 62% framing above bottom typography
  new THREE.Vector3(3.15, 1.04,  1.22),
  new THREE.Vector3(2.45, 1.28, -1.32),
  new THREE.Vector3(1.86, 1.46,  0.34),
  new THREE.Vector3(0.66, boreY, 0.025),
  new THREE.Vector3(0.11, boreY, 0.00),
  new THREE.Vector3(-0.20, boreY, 0.00),
  new THREE.Vector3(-0.41, boreY, 0.00),
], KNOTS, [

]);

const activeTrack = MODE === "mobile" ? mobTrack : deskTrack;

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (t) => t * t * (3 - 2 * t);
const seg = (t, a, b) => smooth(clamp((t - a) / (b - a), 0, 1));
const expoOut = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -9 * x));

function renderAt(t) {
  t = clamp(t, 0, 1);

  const { pos: pPos, look: pLook } = activeTrack.sample(t);
  camera.position.copy(pPos);
  camera.lookAt(pLook);
  backdropHalo.lookAt(pPos);
  const baseFov = MODE === "mobile" ? 41 : 33;
  camera.fov = baseFov + seg(t, 0.72, 0.98) * 7;
  camera.updateProjectionMatrix();

  const scanNorm = seg(t, 0.02, 0.34);
  const scanY = -0.05 + scanNorm * 1.94;
  clipSolidAbove.constant = t < 0.02 ? -0.1 : (t > 0.36 ? 5.0 : scanY);
  clipWireBelow.constant = t < 0.02 ? 0.1 : -scanY;

  scanRingGroup.position.y = scanY;
  const ringVis = t > 0.01 && t < 0.36 ? Math.sin(clamp((t - 0.01) / 0.35, 0, 1) * Math.PI) : 0;
  scanRingGroup.visible = ringVis > 0.02;
  scanDisc.material.opacity = ringVis * 0.16;
  scanRingGroup.scale.setScalar(0.88 + Math.sin(t * 24) * 0.04);

  const wireAlpha = 1 - seg(t, 0.30, 0.52);
  wireGroup.visible = wireAlpha > 0.01;

  const explodeAt = (group, dark, name) => {
    if (group === "base" || group === "legL" || group === "legR") return 1 - expoOut(seg(t, 0.08, 0.28));
    if (group === "waist" || (dark && group === "torso")) return 1 - expoOut(seg(t, 0.16, 0.36));
    if (group === "armL" || group === "armR") return 1 - expoOut(seg(t, 0.24, 0.48));
    if (group === "head" || group === "logo") return 1 - expoOut(seg(t, 0.38, 0.58));
    if (name.startsWith("battery_")) return 1 - expoOut(seg(t, 0.34, 0.56));
    return 1 - expoOut(seg(t, 0.34, 0.56));
  };

  const headEnterFade = seg(t, 0.73, 0.80);
  const fullBodyFade = seg(t, 0.76, 0.84);

  for (const pt of parts) {
    const k = explodeAt(pt.group, pt.dark, pt.name);
    pt.mesh.position.copy(pt.ex).multiplyScalar(k);
    if (pt.group === "head") {
      pt.mesh.position.y += headEnterFade * 0.032;
      pt.mat.opacity = 1 - headEnterFade;
    } else {
      pt.mat.opacity = 1 - fullBodyFade;
    }
    pt.mat.transparent = pt.isCutout || pt.mat.opacity < 0.999;
    if (pt.isDecal) {
      pt.mesh.visible = scanY > pt.center.y && pt.mat.opacity > 0.01;
    }
    if (pt.line) {
      pt.line.position.copy(pt.mesh.position);
      pt.line.material.opacity = wireAlpha * 0.56;
    }
    if (pt.holo) {
      pt.holo.position.copy(pt.mesh.position);
      pt.holo.material.opacity = wireAlpha * 0.085;
    }
  }

  const ledLevel = seg(t, 0.50, 0.62) * (1 - seg(t, 0.73, 0.80));
  ledMat.opacity = ledLevel;
  chestPulseMat.opacity = ledLevel;

  const enterTunnel = seg(t, 0.76, 0.85);
  const coreFade = seg(t, 0.78, 0.88);
  internalBay.visible = enterTunnel > 0.004;
  tunnelMat.opacity = enterTunnel;
  ribMat.opacity = enterTunnel;
  opticGold.opacity = enterTunnel;
  fiberCyan.opacity = enterTunnel;
  fiberViolet.opacity = enterTunnel;
  carrierMat.opacity = coreFade;
  heatsinkMat.opacity = coreFade;
  dieBaseMat.opacity = coreFade;
  chipletDarkMat.opacity = coreFade;
  chipletCyanMat.opacity = coreFade;
  waferMat.opacity = seg(t, 0.78, 0.90);
  dieCoreGridMat.opacity = coreFade * 0.95;
  fiberCyan.color.setHex(0x00f5ff).multiplyScalar(enterTunnel);
  fiberViolet.color.setHex(0x7b2ff7).multiplyScalar(enterTunnel);
  scene.fog.density = 0.145 + seg(t, 0.72, 0.88) * 0.42;
  keyLight.intensity = 3.0 * (1 - seg(t, 0.72, 0.85) * 0.88);
  fillLight.intensity = 0.72 * (1 - seg(t, 0.72, 0.85) * 0.90);
  frontSoft.intensity = 0.52 * (1 - seg(t, 0.72, 0.85) * 0.90);
  coreSpot.intensity = coreFade * 2.1;
  lidarGimbal.rotation.x = t * Math.PI * 6;
  halo1.rotation.z = t * Math.PI * 2.5;
  halo2.rotation.z = -t * Math.PI * 1.8;
  halo3.rotation.z = t * Math.PI * 1.2;
  backdropHalo.material.opacity = 1 - seg(t, 0.74, 0.88);
  backdropHalo.visible = t < 0.89;
  envGroup.visible = t < 0.94;
  robotRoot.visible = t < 0.85;

  composer.render(1 / 30);
}

renderAt(0);
window.__story3d = {
  renderAt,
  renderCustom(pos, look, t = 0.60) {
    renderAt(t);
    camera.position.set(...pos);
    camera.lookAt(...look);
    backdropHalo.lookAt(camera.position);
    composer.render(1 / 30);
  },
  width: W,
  height: H,
  partCount: parts.length
};
